services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_STATIC_URL: ${NEXT_PUBLIC_STATIC_URL}
        NEXT_PUBLIC_SCHEDULE_URL: ${NEXT_PUBLIC_SCHEDULE_URL}
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/sirin.db
      INTERNAL_API_URL: http://127.0.0.1:3000/api/
      NODE_ENV: production
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
